name: Seed Static Data (Teams + Players)

# Teams and player rosters don't change every 5 minutes. Run once a day at
# 04:00 UTC (off-peak for football-data.org) plus a manual button for ad-hoc
# runs (e.g. right after final-squad announcements before kickoff).
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

concurrency:
  group: seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 12 competitions × rate-limited fetches can take ~20 min
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Seed teams and players
        run: node scripts/seed_static_data.js
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
