name: Football Data Relay

on:
  schedule:
    # Every 5 minutes. GitHub silently coalesces anything more frequent,
    # and may delay 10–30 min during peak hours — that's expected.
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # Manual "Run workflow" button for testing.

# Prevent overlapping runs if one is slow.
concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run data relay
        run: node scripts/relay.js
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}

      - name: Enrich with Bzzoiro (lineups, incidents, xG)
        # Runs AFTER the relay so it can match against the matches that the
        # relay just wrote. continue-on-error: true means a Bzzoiro outage
        # never blocks the live-score relay from succeeding.
        continue-on-error: true
        run: node scripts/bzzoiro_enricher.js
        env:
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
